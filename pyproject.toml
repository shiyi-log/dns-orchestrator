[project]
name = "godaddy-dns-manager"
version = "0.1.0"
description = "Django and React dashboard for GoDaddy DNS record management"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
  "Django==4.2.30",
  "djangorestframework==3.16.1",
  "django-cors-headers==4.9.0",
  "cryptography==46.0.2",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-django==4.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
