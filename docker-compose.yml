services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      GODADDY_DEMO_MODE: ${GODADDY_DEMO_MODE:-true}
      GODADDY_PAT: ${GODADDY_PAT:-}
      GODADDY_API_BASE: ${GODADDY_API_BASE:-https://api.godaddy.com}
      CORS_ORIGINS: http://localhost:5173
    command: >
      sh -c "pip install --disable-pip-version-check uv &&
      uv sync &&
      uv run python backend/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
